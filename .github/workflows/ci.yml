name: ci
# Minimal CI for the cht-ui-builder repo. The zero-SNOMED / licensing guard
# in shared/src/fhir/roundtrip.test.ts is only meaningful if it runs unattended
# (the legal exposure ships in the bundled pack on every push), so this
# workflow's job is to make sure build + test + lint run on every push and PR.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared (parsers + serializers)
        run: pnpm --filter @cht-ui/shared build

      - name: Run shared tests (incl. zero-SNOMED + round-trip oracle)
        run: pnpm --filter @cht-ui/shared test

      - name: Smoke-test fhir-mapping round-trip on the committed fixture
        run: node scripts/smoke-parser.mjs shared/src/fhir/__fixtures__/mch-pregnancy.fhir-mapping.json

      - name: Typecheck all workspaces
        run: pnpm typecheck

      # NOTE: `pnpm lint` is deferred from CI pending a separate cleanup PR.
      # The repo's eslint.config.js declares Node globals only for *.ts/*.tsx
      # and lacks browser globals for the client/ workspace and Node globals
      # for *.mjs scripts — so ~100 pre-existing `no-undef` errors gate it
      # today. The Standard codes slice itself is lint-clean
      # (shared/src/fhir/** has zero new errors/warnings). Re-add this step
      # once the eslint config is fixed.

  generated-forms-validate:
    # The pyxform oracle. Nothing else we run can tell whether an XForm's
    # XPaths actually resolve, and that blind spot let a deploy blocker ship:
    # `insertContactFieldRef` emitted `../inputs/contact/name` without
    # declaring the node, and cht-conf's `validate-app-forms` fails the ENTIRE
    # run on one bad XPath — so one form blocked every form and the app
    # settings. Nine green flow tests and a clean typecheck all missed it.
    #
    # Its own job rather than a step in build-test-lint, because it needs
    # python + pyxform and takes noticeably longer than the unit suite.
    # A fast hermetic version of the same invariant runs in the shared tests
    # (insertContactFieldRef.declare.test.ts), so a break shows up there too.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # cht-conf shells out to pyxform for convert-app-forms. Verified
      # locally against pyxform 4.5.0 / cht-conf 6.5.0.
      - name: Install pyxform
        run: python -m pip install --upgrade pyxform

      - run: pnpm install --frozen-lockfile

      # The script drives the REAL generator out of shared/dist rather than
      # reimplementing it, so shared has to be built first.
      - name: Build shared
        run: pnpm --filter @cht-ui/shared build

      # Asserts both directions: a form this tool generates passes, AND a
      # deliberately-broken one is rejected. Without the second check a
      # validator that stopped looking would still show green.
      - name: Validate tool-generated forms with cht-conf + pyxform
        run: node scripts/validate-generated-forms.mjs

  e2e:
    # Browser-driven Playwright suite against the committed mini-config fixture.
    # playwright.config.ts boots a non-watch API server (server `start`) + Vite
    # via its `webServer` block, so this job just needs the builds in place.
    # Only the fresh-clone-safe specs run here; helper-builder.spec.ts needs a
    # real cht-conf project with a contact-summary file and is excluded until
    # the fixture grows one (see PR notes).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # webServer runs `server start` (node dist) + Vite (serves prebuilt
      # shared/dist), so both must be built before Playwright launches them.
      - name: Build shared + server
        run: |
          pnpm --filter @cht-ui/shared build
          pnpm --filter @cht-ui/server build

      - name: Install Playwright browser
        run: pnpm --filter @cht-ui/client exec playwright install --with-deps chromium

      - name: Run e2e (condition-builder + form-editing + fhir-mapping + form-data-passing + quick-hierarchy + contact-form-tile-classification + form-context-types + hierarchy-ux-polish + poc-build + anc-build + geriatric-blockers)
        # anc-build-deploy runs CI-safe by default (build + on-disk assertions only);
        # ANC_OUTPUT_DIR gives it a Linux-portable path, and the live deploy stays
        # off (it only runs under LIVE_DEPLOY=1, which CI never sets).
        # geriatric-blockers covers the choice-value dropdowns (§1) and the OR
        # authoring → &&-guard round-trip (§3) against mini-config; its write
        # leg copies the fixture to a temp dir first, so it's hermetic.
        env:
          ANC_OUTPUT_DIR: ${{ runner.temp }}/anc-build
        run: pnpm --filter @cht-ui/client exec playwright test condition-builder.spec.ts form-editing.spec.ts fhir-mapping.spec.ts form-data-passing.spec.ts quick-hierarchy.spec.ts contact-form-tile-classification.spec.ts form-context-types.spec.ts hierarchy-ux-polish.spec.ts poc-build.spec.ts anc-build-deploy.spec.ts geriatric-blockers.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
